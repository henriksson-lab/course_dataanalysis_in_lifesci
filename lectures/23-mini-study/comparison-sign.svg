<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>The same observed difference has opposite signs when comparison order reverses</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<line x1="140" y1="245" x2="950" y2="245" stroke="#203247" stroke-width="4"/>
<circle cx="240" cy="245" r="17" fill="#2a7f8f" stroke="none" stroke-width="3"/>
<text x="240" y="330" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="middle" font-weight="normal">reference</text>
<text x="240" y="380" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">28.20 mg</text>
<circle cx="860" cy="245" r="17" fill="#6b4fa0" stroke="none" stroke-width="3"/>
<text x="860" y="330" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="middle" font-weight="normal">supplement</text>
<text x="860" y="380" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">33.92 mg</text>
<line x1="270" y1="140" x2="830" y2="140" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="95" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">supplement − reference = +5.72 mg</text>
<line x1="830" y1="440" x2="270" y2="440" stroke="#3b5bab" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="485" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">reference − supplement = −5.72 mg</text>
</svg>
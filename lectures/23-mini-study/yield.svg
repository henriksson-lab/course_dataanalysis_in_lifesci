<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Percentage yield is collected mass divided by the supplied maximum</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<text x="75" y="80" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="bold">Y01: theoretical maximum supplied</text>
<rect x="75" y="115" width="850" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
<text x="960" y="160" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="start" font-weight="normal">1.00 g</text>
<text x="75" y="260" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="bold">Dry product collected</text>
<rect x="75" y="295" width="527.0" height="70" rx="10" fill="#d9caed" stroke="#6b4fa0" stroke-width="3"/>
<text x="640" y="340" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="start" font-weight="normal">0.62 g</text>
<text x="550" y="450" font-family="Arial, sans-serif" font-size="33" fill="#203247" text-anchor="middle" font-weight="normal">100 × 0.62 / 1.00 = 62% yield</text>
</svg>
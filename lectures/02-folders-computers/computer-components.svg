<rect x="599" y="215" width="30" height="95" rx="0" fill="#2a7f8f" stroke="#2a7f8f" stroke-width="3"/>
<rect x="810" y="150" width="190" height="170" rx="10" fill="#f4eefb" stroke="#6b4fa0" stroke-width="3"/>

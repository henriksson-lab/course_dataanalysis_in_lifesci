<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A corrected estimate needs both a new measured reading and the supplied volume factor</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="50" y="120" width="260" height="220" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="180" y="180" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">new reading</text>
<text x="180" y="235" font-family="Arial, sans-serif" font-size="43" fill="#203247" text-anchor="middle" font-weight="normal">0.520</text>
<text x="180" y="300" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">measured diluted</text>
<rect x="420" y="120" width="260" height="220" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="550" y="180" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">inverse estimate</text>
<text x="550" y="235" font-family="Arial, sans-serif" font-size="40" fill="#203247" text-anchor="middle" font-weight="normal">7.40 mg/L</text>
<text x="550" y="300" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">diluted sample</text>
<rect x="790" y="120" width="260" height="220" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="920" y="180" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">factor 10</text>
<text x="920" y="235" font-family="Arial, sans-serif" font-size="40" fill="#203247" text-anchor="middle" font-weight="normal">74.04 mg/L</text>
<text x="920" y="300" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">original estimate</text>
<line x1="330" y1="225" x2="400" y2="225" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="700" y1="225" x2="770" y2="225" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="425" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">The original estimate is not a new direct instrument reading.</text>
</svg>
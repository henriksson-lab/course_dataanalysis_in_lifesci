<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Observed results support a description before broader causal claims</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="70" y="270" width="220" height="100" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="180" y="328" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">measured plants</text>
<rect x="450" y="170" width="220" height="100" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="560" y="228" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">sample description</text>
<rect x="825" y="70" width="220" height="100" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="3"/>
<text x="935" y="128" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">universal cause?</text>
<line x1="310" y1="300" x2="420" y2="230" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="700" y1="200" x2="800" y2="130" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="725" y1="120" x2="785" y2="180" stroke="#a8324a" stroke-width="7"/>
<line x1="785" y1="120" x2="725" y2="180" stroke="#a8324a" stroke-width="7"/>
<text x="550" y="440" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">The last step needs more evidence than a larger mean.</text>
</svg>
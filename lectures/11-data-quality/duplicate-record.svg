<text x="430" y="165" font-family="Arial, sans-serif" font-size="20" fill="#203247" text-anchor="middle" font-weight="normal">25.7 → 44.3 mm</text>
<path d="M340,270 h150 l30,30 v75 h-180 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>

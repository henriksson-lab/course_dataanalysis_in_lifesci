<text x="835" y="215" font-family="Arial, sans-serif" font-size="32" fill="#203247" text-anchor="middle" font-weight="normal">Two rows</text>
<text x="835" y="265" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">one measured plant</text>

<line x1="120" y1="235" x2="945" y2="235" stroke="#3b5bab" stroke-width="4"/>
<text x="550" y="285" font-family="Arial, sans-serif" font-size="33" fill="#203247" text-anchor="middle" font-weight="normal">8 bits = 1 byte</text>
<text x="550" y="350" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">256 patterns can encode values 0–255</text>
<text x="550" y="415" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">The file format tells software what those values mean</text>

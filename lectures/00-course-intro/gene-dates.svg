<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A spreadsheet converts gene symbols into dates</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<text x="110" y="60" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="bold">You type</text>
<text x="690" y="60" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="bold">The spreadsheet stores</text>
<rect x="110" y="90" width="300" height="56" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="126" y="127" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="start" font-weight="normal">SEPT2</text>
<rect x="690" y="90" width="300" height="56" rx="0" fill="#fbe9ec" stroke="#cbd5e1" stroke-width="3"/>
<text x="706" y="127" font-family="Arial, sans-serif" font-size="24" fill="#a8324a" text-anchor="start" font-weight="bold">2-Sep</text>
<line x1="430" y1="118" x2="670" y2="118" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="110" y="156" width="300" height="56" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="126" y="193" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="start" font-weight="normal">MARCH1</text>
<rect x="690" y="156" width="300" height="56" rx="0" fill="#fbe9ec" stroke="#cbd5e1" stroke-width="3"/>
<text x="706" y="193" font-family="Arial, sans-serif" font-size="24" fill="#a8324a" text-anchor="start" font-weight="bold">1-Mar</text>
<line x1="430" y1="184" x2="670" y2="184" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="110" y="222" width="300" height="56" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="126" y="259" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="start" font-weight="normal">DEC1</text>
<rect x="690" y="222" width="300" height="56" rx="0" fill="#fbe9ec" stroke="#cbd5e1" stroke-width="3"/>
<text x="706" y="259" font-family="Arial, sans-serif" font-size="24" fill="#a8324a" text-anchor="start" font-weight="bold">1-Dec</text>
<line x1="430" y1="250" x2="670" y2="250" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="110" y="288" width="300" height="56" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="126" y="325" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="start" font-weight="normal">TP53</text>
<rect x="690" y="288" width="300" height="56" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="706" y="325" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="start" font-weight="normal">TP53</text>
<line x1="430" y1="316" x2="670" y2="316" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="400" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">The gene name is gone; the date cannot be turned back reliably.</text>
<text x="550" y="445" font-family="Arial, sans-serif" font-size="24" fill="#64748b" text-anchor="middle" font-weight="normal">Gene lists in published supplementary files were affected.</text>
</svg>
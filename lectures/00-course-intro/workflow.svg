<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A reproducible analysis from raw file to report</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="20" y="150" width="180" height="130" rx="10" fill="#f8fafc" stroke="#3b5bab" stroke-width="3"/>
<text x="110" y="205" font-family="Arial, sans-serif" font-size="27" fill="#3b5bab" text-anchor="middle" font-weight="bold">raw data</text>
<text x="110" y="245" font-family="Arial, sans-serif" font-size="21" fill="#203247" text-anchor="middle" font-weight="normal">seedlings.csv</text>
<line x1="204" y1="215" x2="234" y2="215" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="238" y="150" width="180" height="130" rx="10" fill="#f8fafc" stroke="#6b4fa0" stroke-width="3"/>
<text x="328" y="205" font-family="Arial, sans-serif" font-size="27" fill="#6b4fa0" text-anchor="middle" font-weight="bold">code</text>
<text x="328" y="245" font-family="Arial, sans-serif" font-size="21" fill="#203247" text-anchor="middle" font-weight="normal">analysis.Rmd</text>
<line x1="422" y1="215" x2="452" y2="215" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="456" y="150" width="180" height="130" rx="10" fill="#f8fafc" stroke="#2a7f8f" stroke-width="3"/>
<text x="546" y="205" font-family="Arial, sans-serif" font-size="27" fill="#2a7f8f" text-anchor="middle" font-weight="bold">checks</text>
<text x="546" y="245" font-family="Arial, sans-serif" font-size="21" fill="#203247" text-anchor="middle" font-weight="normal">counts, units</text>
<line x1="640" y1="215" x2="670" y2="215" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="674" y="150" width="180" height="130" rx="10" fill="#f8fafc" stroke="#2a7f8f" stroke-width="3"/>
<text x="764" y="205" font-family="Arial, sans-serif" font-size="27" fill="#2a7f8f" text-anchor="middle" font-weight="bold">results</text>
<text x="764" y="245" font-family="Arial, sans-serif" font-size="21" fill="#203247" text-anchor="middle" font-weight="normal">plot + test</text>
<line x1="858" y1="215" x2="888" y2="215" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="892" y="150" width="180" height="130" rx="10" fill="#f8fafc" stroke="#3b5bab" stroke-width="3"/>
<text x="982" y="205" font-family="Arial, sans-serif" font-size="27" fill="#3b5bab" text-anchor="middle" font-weight="bold">report</text>
<text x="982" y="245" font-family="Arial, sans-serif" font-size="21" fill="#203247" text-anchor="middle" font-weight="normal">report.html</text>
<path d="M 1000 290 C 1000 420, 110 420, 110 290" fill="none" stroke="#64748b" stroke-width="3"/>
<text x="550" y="455" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Change the data or a decision, re-run, and every number and figure updates.</text>
<text x="550" y="100" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Every step is written down, so anyone can repeat it.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A command follows the shell prompt</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="70" y="140" width="960" height="130" rx="10" fill="#203247" stroke="#203247" stroke-width="3"/>
<text x="115" y="225" font-family="Arial, sans-serif" font-size="36" fill="#bce9d2" text-anchor="start" font-weight="normal">anna@laptop:~$</text>
<text x="470" y="225" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="start" font-weight="normal">cd</text>
<text x="585" y="225" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="start" font-weight="normal">practice</text>
<line x1="280" y1="280" x2="280" y2="370" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="280" y="425" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">prompt: do not type</text>
<line x1="490" y1="280" x2="505" y2="370" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="505" y="425" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">command</text>
<line x1="685" y1="280" x2="840" y2="370" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="840" y="425" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">argument: destination</text>
</svg>
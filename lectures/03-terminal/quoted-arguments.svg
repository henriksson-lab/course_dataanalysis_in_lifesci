<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Quotes make a space-containing folder name one argument</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<text x="70" y="70" font-family="Arial, sans-serif" font-size="34" fill="#203247" text-anchor="start" font-weight="normal">mkdir field notes</text>
<line x1="430" y1="65" x2="650" y2="65" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M650,40 v-20 h64.0 l20,20 h76.0 v70 h-160 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="730.0" y="83.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">field</text>
<path d="M865,40 v-20 h64.0 l20,20 h76.0 v70 h-160 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="945.0" y="83.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">notes</text>
<text x="70" y="280" font-family="Arial, sans-serif" font-size="34" fill="#203247" text-anchor="start" font-weight="normal">mkdir &quot;field notes&quot;</text>
<line x1="500" y1="270" x2="700" y2="270" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M720,250 v-20 h100.0 l20,20 h130.0 v80 h-250 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="845.0" y="298.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">field notes</text>
<text x="550" y="440" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="normal">Unquoted words may become separate arguments.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>An unavailable reading and a high recorded reading require different reasoning</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M200,90 v55 l-50,110 h140 l-50,-110 v-55" fill="#e6f3f5" stroke="#a8324a" stroke-width="4"/>
<text x="215" y="330" font-family="Arial, sans-serif" font-size="35" fill="#203247" text-anchor="middle" font-weight="bold">A19</text>
<text x="215" y="390" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">unavailable after spill</text>
<path d="M805,90 v55 l-50,110 h140 l-50,-110 v-55" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="4"/>
<text x="820" y="330" font-family="Arial, sans-serif" font-size="35" fill="#203247" text-anchor="middle" font-weight="bold">A11</text>
<text x="820" y="390" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">recorded high value</text>
<text x="215" y="190" font-family="Arial, sans-serif" font-size="45" fill="#a8324a" text-anchor="middle" font-weight="normal">?</text>
<text x="820" y="190" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="normal">41.7</text>
<text x="550" y="475" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">Missing is not zero; high is not automatically erroneous</text>
</svg>
<text x="588" y="158" font-family="Arial, sans-serif" font-size="18" fill="#203247" text-anchor="start" font-weight="normal">P01</text>
<rect x="680" y="130" width="125" height="40" rx="0" fill="white" stroke="#cbd5e1" stroke-width="3"/>
<text x="688" y="158" font-family="Arial, sans-serif" font-size="18" fill="#203247" text-anchor="start" font-weight="normal">25.7</text>
<rect x="805" y="130" width="110" height="40" rx="0" fill="white" stroke="#cbd5e1" stroke-width="3"/>
<text x="813" y="158" font-family="Arial, sans-serif" font-size="18" fill="#203247" text-anchor="start" font-weight="normal">44.3</text>
<rect x="915" y="130" width="135" height="40" rx="0" fill="white" stroke="#cbd5e1" stroke-width="3"/>
<text x="923" y="158" font-family="Arial, sans-serif" font-size="18" fill="#6b4fa0" text-anchor="start" font-weight="normal">=D2-C2</text>
<rect x="580" y="280" width="140" height="34" rx="0" fill="#cfe8e3" stroke="#6b4fa0" stroke-width="3"/>
<text x="590" y="304" font-family="Arial, sans-serif" font-size="18" fill="#203247" text-anchor="start" font-weight="normal">measurements</text>

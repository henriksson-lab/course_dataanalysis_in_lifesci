<text x="730" y="304" font-family="Arial, sans-serif" font-size="18" fill="#203247" text-anchor="start" font-weight="normal">notes</text>
<text x="580" y="215" font-family="Arial, sans-serif" font-size="21" fill="#6b4fa0" text-anchor="start" font-weight="normal">+ formatting   + formulas   + several sheets</text>
<text x="550" y="390" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">CSV: any program can read it, and what you see is what is stored.</text>
<text x="550" y="430" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">xlsx: you need a spreadsheet program, and the screen can hide things.</text>

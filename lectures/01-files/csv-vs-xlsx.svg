<rect x="805" y="90" width="110" height="40" rx="0" fill="#cfe8e3" stroke="#cbd5e1" stroke-width="3"/>
<text x="813" y="118" font-family="Arial, sans-serif" font-size="18" fill="#203247" text-anchor="start" font-weight="bold">final_mm</text>
<rect x="915" y="90" width="135" height="40" rx="0" fill="#cfe8e3" stroke="#cbd5e1" stroke-width="3"/>
<text x="923" y="118" font-family="Arial, sans-serif" font-size="18" fill="#203247" text-anchor="start" font-weight="bold">growth_mm</text>

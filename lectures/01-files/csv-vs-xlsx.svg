<rect x="560" y="30" width="510" height="40" rx="10" fill="#dceaf6" stroke="#6b4fa0" stroke-width="3"/>
<text x="575" y="58" font-family="Arial, sans-serif" font-size="20" fill="#203247" text-anchor="start" font-weight="bold">seedlings.xlsx</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>The same table as CSV and as an Excel workbook</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="30" y="30" width="470" height="300" rx="10" fill="#f8fafc" stroke="#3b5bab" stroke-width="3"/>
<rect x="30" y="30" width="470" height="40" rx="10" fill="#dceaf6" stroke="#3b5bab" stroke-width="3"/>
<text x="45" y="58" font-family="Arial, sans-serif" font-size="20" fill="#203247" text-anchor="start" font-weight="bold">seedlings.csv</text>
<text x="50" y="110" font-family="Consolas, Menlo, monospace" font-size="19" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">plant_id,treatment,initial_mm,final_mm</text>
<text x="50" y="154" font-family="Consolas, Menlo, monospace" font-size="19" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">P01,control,25.7,44.3</text>
<text x="50" y="198" font-family="Consolas, Menlo, monospace" font-size="19" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">P02,control,24.3,32.3</text>
<text x="265" y="300" font-family="Arial, sans-serif" font-size="24" fill="#2a7f8f" text-anchor="middle" font-weight="normal">values only</text>

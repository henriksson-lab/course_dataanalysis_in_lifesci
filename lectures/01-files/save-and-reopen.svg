<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Saving makes an edited note available after reopening</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="40" y="100" width="250" height="240" rx="10" fill="#f1f5f9" stroke="#3b5bab" stroke-width="3"/>
<text x="165" y="65" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">Edit in memory</text>
<line x1="75" y1="155" x2="235" y2="155" stroke="#2a7f8f" stroke-width="6"/>
<line x1="75" y1="207" x2="255" y2="207" stroke="#2a7f8f" stroke-width="6"/>
<line x1="75" y1="259" x2="205" y2="259" stroke="#2a7f8f" stroke-width="6"/>
<rect x="430" y="100" width="250" height="240" rx="10" fill="#f1f5f9" stroke="#3b5bab" stroke-width="3"/>
<text x="555" y="65" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">Save to disk</text>
<line x1="465" y1="155" x2="625" y2="155" stroke="#2a7f8f" stroke-width="6"/>
<line x1="465" y1="207" x2="645" y2="207" stroke="#2a7f8f" stroke-width="6"/>
<line x1="465" y1="259" x2="595" y2="259" stroke="#2a7f8f" stroke-width="6"/>
<rect x="810" y="100" width="250" height="240" rx="10" fill="#f1f5f9" stroke="#3b5bab" stroke-width="3"/>
<text x="935" y="65" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">Reopen file</text>
<line x1="845" y1="155" x2="1005" y2="155" stroke="#2a7f8f" stroke-width="6"/>
<line x1="845" y1="207" x2="1025" y2="207" stroke="#2a7f8f" stroke-width="6"/>
<line x1="845" y1="259" x2="975" y2="259" stroke="#2a7f8f" stroke-width="6"/>
<line x1="310" y1="220" x2="410" y2="220" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="700" y1="220" x2="790" y2="220" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="430" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Check the folder and filename, then close and reopen.</text>
</svg>
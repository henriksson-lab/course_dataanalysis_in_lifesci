<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Renaming changes the label, not the contents</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M40,40 h120 l30,30 v90 h-150 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="160" y1="40" x2="160" y2="70" stroke="#3b5bab" stroke-width="3"/>
<line x1="160" y1="70" x2="190" y2="70" stroke="#3b5bab" stroke-width="3"/>
<text x="115.0" y="195" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">seedlings.csv</text>
<line x1="220" y1="100" x2="400" y2="100" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="310" y="80" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">rename</text>
<path d="M430,40 h120 l30,30 v90 h-150 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="550" y1="40" x2="550" y2="70" stroke="#3b5bab" stroke-width="3"/>
<line x1="550" y1="70" x2="580" y2="70" stroke="#3b5bab" stroke-width="3"/>
<text x="505.0" y="195" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">seedlings.xlsx</text>
<text x="650" y="90" font-family="Arial, sans-serif" font-size="25" fill="#a8324a" text-anchor="start" font-weight="normal">Still plain text inside.</text>
<text x="650" y="126" font-family="Arial, sans-serif" font-size="25" fill="#a8324a" text-anchor="start" font-weight="normal">Excel refuses to open it.</text>
<path d="M40,270 h120 l30,30 v90 h-150 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="160" y1="270" x2="160" y2="300" stroke="#3b5bab" stroke-width="3"/>
<line x1="160" y1="300" x2="190" y2="300" stroke="#3b5bab" stroke-width="3"/>
<text x="115.0" y="425" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">notes.docx</text>
<line x1="220" y1="330" x2="400" y2="330" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="310" y="310" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">rename</text>
<path d="M430,270 h120 l30,30 v90 h-150 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="550" y1="270" x2="550" y2="300" stroke="#3b5bab" stroke-width="3"/>
<line x1="550" y1="300" x2="580" y2="300" stroke="#3b5bab" stroke-width="3"/>
<text x="505.0" y="425" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">notes.zip</text>
<text x="650" y="320" font-family="Arial, sans-serif" font-size="25" fill="#2a7f8f" text-anchor="start" font-weight="normal">It was a ZIP all along.</text>
<text x="650" y="356" font-family="Arial, sans-serif" font-size="25" fill="#2a7f8f" text-anchor="start" font-weight="normal">Now you can look inside.</text>
</svg>
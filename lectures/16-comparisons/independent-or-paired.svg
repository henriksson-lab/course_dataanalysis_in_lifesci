<text x="850" y="100" font-family="Arial, sans-serif" font-size="33" fill="#203247" text-anchor="middle" font-weight="normal">Same plant twice</text>
<text x="550" y="450" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">Pairing comes from identities and design, not from two columns.</text>

<text x="730" y="305" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">L01 before</text>
<path d="M938,245 h44 l-7,34 h-30 Z" fill="#cfb797" stroke="#80664b" stroke-width="2"/>

<rect width="1100" height="500" fill="white"/>
<path d="M128,245 h44 l-7,34 h-30 Z" fill="#cfb797" stroke="#80664b" stroke-width="2"/>
<line x1="150" y1="245" x2="150" y2="187" stroke="#2a7f8f" stroke-width="3"/>
<path d="M150,217 Q105,180 120,180 Q150,180 150,217" fill="#2a7f8f" stroke="#2a7f8f" stroke-width="2"/>
<path d="M150,203 Q195,165 180,165 Q150,165 150,203" fill="#2a7f8f" stroke="#2a7f8f" stroke-width="2"/>
<text x="150" y="305" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">P01</text>
<path d="M358,245 h44 l-7,34 h-30 Z" fill="#cfb797" stroke="#80664b" stroke-width="2"/>

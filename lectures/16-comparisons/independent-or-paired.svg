<text x="380" y="305" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">P13</text>
<text x="265" y="100" font-family="Arial, sans-serif" font-size="33" fill="#203247" text-anchor="middle" font-weight="normal">Different plants</text>
<line x1="550" y1="40" x2="550" y2="440" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>
<path d="M708,245 h44 l-7,34 h-30 Z" fill="#cfb797" stroke="#80664b" stroke-width="2"/>

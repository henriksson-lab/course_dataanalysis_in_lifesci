<path d="M960,203 Q1005,165 990,165 Q960,165 960,203" fill="#6b4fa0" stroke="#6b4fa0" stroke-width="2"/>
<text x="960" y="305" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">L01 after</text>

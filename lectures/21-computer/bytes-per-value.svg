<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Bytes needed for one letter, one pixel, and one number in R</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<text x="40" y="115" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="normal">one DNA letter in a text file</text>
<rect x="470" y="70" width="50" height="70" rx="4" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<text x="495" y="117" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="bold">A</text>
<text x="553" y="117" font-family="Arial, sans-serif" font-size="28" fill="#3b5bab" text-anchor="start" font-weight="bold">1 byte</text>
<text x="40" y="255" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="normal">one pixel in a grey image file</text>
<rect x="470" y="210" width="50" height="70" rx="4" fill="#9a9a9a" stroke="#64748b" stroke-width="3"/>
<text x="553" y="257" font-family="Arial, sans-serif" font-size="28" fill="#64748b" text-anchor="start" font-weight="bold">1 byte</text>
<text x="40" y="395" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="normal">one number in R</text>
<rect x="470" y="350" width="50" height="70" rx="4" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<rect x="528" y="350" width="50" height="70" rx="4" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<rect x="586" y="350" width="50" height="70" rx="4" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<rect x="644" y="350" width="50" height="70" rx="4" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<rect x="702" y="350" width="50" height="70" rx="4" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<rect x="760" y="350" width="50" height="70" rx="4" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<rect x="818" y="350" width="50" height="70" rx="4" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<rect x="876" y="350" width="50" height="70" rx="4" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="959" y="397" font-family="Arial, sans-serif" font-size="28" fill="#2a7f8f" text-anchor="start" font-weight="bold">8 bytes</text>
<text x="550" y="480" font-family="Arial, sans-serif" font-size="24" fill="#64748b" text-anchor="middle" font-weight="normal">1 byte = 8 bits = one of 256 patterns (0–255)</text>
</svg>
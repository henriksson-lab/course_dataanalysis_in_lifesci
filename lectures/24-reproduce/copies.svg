<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Windows and Ubuntu copies do not automatically synchronise</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M80,145 v-20 h132.0 l20,20 h178.0 v130 h-330 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="245.0" y="218.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Windows copy</text>
<path d="M690,145 v-20 h132.0 l20,20 h178.0 v130 h-330 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="855.0" y="218.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Ubuntu copy</text>
<line x1="440" y1="190" x2="655" y2="190" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="145" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">copy deliberately</text>
<text x="245" y="350" font-family="Arial, sans-serif" font-size="26" fill="#3b5bab" text-anchor="middle" font-weight="normal">Edit here?</text>
<text x="850" y="350" font-family="Arial, sans-serif" font-size="26" fill="#2a7f8f" text-anchor="middle" font-weight="normal">Recopy before making ZIP</text>
<text x="550" y="445" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">Return the ZIP to Windows for the native RStudio check</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A ZIP beside the original is not a backup</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="40" y="50" width="500" height="330" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
<text x="290" y="95" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="bold">Your laptop</text>
<path d="M80,170 v-20 h80.0 l20,20 h100.0 v70 h-200 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="180.0" y="213.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">report-share</text>
<path d="M330,130 h140 l30,30 v90 h-170 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="470" y1="130" x2="470" y2="160" stroke="#3b5bab" stroke-width="3"/>
<line x1="470" y1="160" x2="500" y2="160" stroke="#3b5bab" stroke-width="3"/>
<text x="415.0" y="285" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report-share.zip</text>
<line x1="262" y1="292" x2="318" y2="348" stroke="#a8324a" stroke-width="6"/>
<line x1="262" y1="348" x2="318" y2="292" stroke="#a8324a" stroke-width="6"/>
<text x="290" y="420" font-family="Arial, sans-serif" font-size="22" fill="#a8324a" text-anchor="middle" font-weight="normal">lost together if the laptop is lost</text>
<line x1="560" y1="210" x2="690" y2="210" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="710" y="50" width="350" height="330" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="885" y="95" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="bold">Separate supported</text>
<text x="885" y="128" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="bold">storage</text>
<path d="M800,160 h140 l30,30 v90 h-170 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="940" y1="160" x2="940" y2="190" stroke="#3b5bab" stroke-width="3"/>
<line x1="940" y1="190" x2="970" y2="190" stroke="#3b5bab" stroke-width="3"/>
<text x="885.0" y="315" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">copy of the project</text>
<text x="885" y="420" font-family="Arial, sans-serif" font-size="22" fill="#2a7f8f" text-anchor="middle" font-weight="normal">survives a lost laptop</text>
<text x="550" y="480" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Share with a ZIP; protect with a copy somewhere else.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>An old HTML file does not update merely because the source was edited</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M70,115 h180 l30,30 v150 h-210 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="250" y1="115" x2="250" y2="145" stroke="#3b5bab" stroke-width="3"/>
<line x1="250" y1="145" x2="280" y2="145" stroke="#3b5bab" stroke-width="3"/>
<text x="175.0" y="330" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">source revised</text>
<path d="M800,115 h180 l30,30 v150 h-210 Z" fill="#f1eaf8" stroke="#3b5bab" stroke-width="3"/>
<line x1="980" y1="115" x2="980" y2="145" stroke="#3b5bab" stroke-width="3"/>
<line x1="980" y1="145" x2="1010" y2="145" stroke="#3b5bab" stroke-width="3"/>
<text x="905.0" y="330" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">old HTML</text>
<text x="175" y="205" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">new code</text>
<text x="905" y="205" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">old result</text>
<line x1="325" y1="205" x2="750" y2="205" stroke="#a8324a" stroke-width="5" stroke-dasharray="10 8"/>
<text x="540" y="155" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">render not rerun</text>
<text x="550" y="435" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Check the generated output, not only the editor buffer</text>
</svg>
<text x="510" y="135" font-family="Arial, sans-serif" font-size="29" fill="#a8324a" text-anchor="middle" font-weight="normal">path mismatch</text>
<text x="550" y="405" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Restore the copied input name, then verify the result</text>

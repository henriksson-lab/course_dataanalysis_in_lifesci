<line x1="235" y1="130" x2="265" y2="130" stroke="#3b5bab" stroke-width="3"/>
<text x="165.0" y="305" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report.Rmd</text>
<text x="165" y="185" font-family="Arial, sans-serif" font-size="20" fill="#203247" text-anchor="middle" font-weight="normal">data/algae.csv</text>

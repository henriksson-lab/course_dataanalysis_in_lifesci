<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A project stays portable when relative input paths stay inside it</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M60,80 v-20 h112.0 l20,20 h148.0 v80 h-280 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="200.0" y="128.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">project A</text>
<path d="M90,245 h130 l30,30 v70 h-160 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="220" y1="245" x2="220" y2="275" stroke="#3b5bab" stroke-width="3"/>
<line x1="220" y1="275" x2="250" y2="275" stroke="#3b5bab" stroke-width="3"/>
<text x="170.0" y="380" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report.Rmd</text>
<path d="M360,270 v-20 h72.0 l20,20 h88.0 v80 h-180 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="450.0" y="318.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">data</text>
<line x1="590" y1="200" x2="745" y2="200" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M790,80 v-20 h112.0 l20,20 h148.0 v80 h-280 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="930.0" y="128.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">new location</text>
<path d="M795,245 h110 l30,30 v70 h-140 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="905" y1="245" x2="905" y2="275" stroke="#3b5bab" stroke-width="3"/>
<line x1="905" y1="275" x2="935" y2="275" stroke="#3b5bab" stroke-width="3"/>
<text x="865.0" y="380" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report.Rmd</text>
<path d="M960,275 v-20 h48.0 l20,20 h52.0 v70 h-120 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="1020.0" y="318.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">data</text>
<text x="550" y="450" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">data/seedlings.csv works from either complete project root.</text>
</svg>
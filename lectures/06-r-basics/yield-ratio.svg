<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Percentage yield compares collected mass with a supplied maximum</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="70" y="80" width="390" height="110" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="265.0" y="144.0" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">supplied maximum: 1.00 g</text>
<rect x="70" y="250" width="800" height="85" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
<rect x="70" y="250" width="496" height="85" rx="0" fill="#bce9d2" stroke="#2a7f8f" stroke-width="3"/>
<text x="318" y="305" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="middle" font-weight="normal">collected: 0.62 g</text>
<text x="980" y="310" font-family="Arial, sans-serif" font-size="44" fill="#2a7f8f" text-anchor="middle" font-weight="normal">62%</text>
<text x="550" y="435" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">100 × 0.62 / 1.00 = 62; masses use the same units.</text>
</svg>
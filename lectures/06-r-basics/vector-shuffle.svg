<path d="M840,95 Q1060,170 840,315" fill="none" stroke="#a8324a" stroke-width="4"/>
<text x="550" y="445" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">Reordering one vector changes the biological pairing.</text>

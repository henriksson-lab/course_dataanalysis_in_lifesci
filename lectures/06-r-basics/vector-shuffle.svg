<rect width="1100" height="500" fill="white"/>
<text x="65" y="100" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="start" font-weight="normal">P1</text>
<text x="260" y="100" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="start" font-weight="normal">20</text>
<text x="820" y="100" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="start" font-weight="normal">37</text>
<line x1="350" y1="88" x2="735" y2="88" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="65" y="210" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="start" font-weight="normal">P2</text>
<text x="260" y="210" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="start" font-weight="normal">22</text>
<text x="820" y="210" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="start" font-weight="normal">40</text>
<line x1="350" y1="198" x2="735" y2="198" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="65" y="320" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="start" font-weight="normal">P3</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img">
<title>A spreadsheet result hides how it was made; a script lists every step and can be run again</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="520" fill="white"/>
<text x="290" y="45" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="bold">Clicking in a spreadsheet</text>
<rect x="80" y="80" width="140" height="46" rx="0" fill="#dbe8f3" stroke="#64748b" stroke-width="3"/>
<text x="150" y="112" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="bold">A</text>
<rect x="220" y="80" width="140" height="46" rx="0" fill="#dbe8f3" stroke="#64748b" stroke-width="3"/>
<text x="290" y="112" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="bold">B</text>
<rect x="360" y="80" width="140" height="46" rx="0" fill="#dbe8f3" stroke="#64748b" stroke-width="3"/>
<text x="430" y="112" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="bold">C</text>
<rect x="80" y="126" width="140" height="46" rx="0" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="150" y="158" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">20</text>
<rect x="220" y="126" width="140" height="46" rx="0" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="290" y="158" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">37</text>
<rect x="360" y="126" width="140" height="46" rx="0" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="430" y="158" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">17</text>
<rect x="80" y="172" width="140" height="46" rx="0" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="150" y="204" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">22</text>
<rect x="220" y="172" width="140" height="46" rx="0" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="290" y="204" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">40</text>
<rect x="360" y="172" width="140" height="46" rx="0" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="430" y="204" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">18</text>
<rect x="80" y="218" width="140" height="46" rx="0" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="150" y="250" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">19</text>
<rect x="220" y="218" width="140" height="46" rx="0" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="290" y="250" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">34</text>
<rect x="360" y="218" width="140" height="46" rx="0" fill="white" stroke="#64748b" stroke-width="3"/>
<text x="430" y="250" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">15</text>
<text x="290" y="330" font-family="Arial, sans-serif" font-size="23" fill="#a8324a" text-anchor="middle" font-weight="normal">Which cells? Typed or calculated?</text>
<text x="290" y="365" font-family="Arial, sans-serif" font-size="23" fill="#a8324a" text-anchor="middle" font-weight="normal">Sorted, deleted, pasted?</text>
<text x="290" y="400" font-family="Arial, sans-serif" font-size="23" fill="#a8324a" text-anchor="middle" font-weight="normal">The clicks were not recorded.</text>
<line x1="600" y1="30" x2="600" y2="490" stroke="#cbd5e1" stroke-width="2"/>
<text x="900" y="45" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="bold">Writing a script</text>
<path d="M640,80 h500 l30,30 v220 h-530 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<text x="660" y="140" font-family="DejaVu Sans Mono, monospace" font-size="21" fill="#203247">initial_mm &lt;- c(20, 22, 19)</text>
<text x="660" y="184" font-family="DejaVu Sans Mono, monospace" font-size="21" fill="#203247">final_mm &lt;- c(37, 40, 34)</text>
<text x="660" y="228" font-family="DejaVu Sans Mono, monospace" font-size="21" fill="#203247">growth_mm &lt;- final_mm - initial_mm</text>
<text x="660" y="272" font-family="DejaVu Sans Mono, monospace" font-size="21" fill="#203247">growth_mm</text>
<text x="900" y="365" font-family="Arial, sans-serif" font-size="23" fill="#2a7f8f" text-anchor="middle" font-weight="normal">Every step is written down.</text>
<text x="900" y="400" font-family="Arial, sans-serif" font-size="23" fill="#2a7f8f" text-anchor="middle" font-weight="normal">Run it again: 17 18 15, every time.</text>
</svg>
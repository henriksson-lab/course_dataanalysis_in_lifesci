<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img">
<title>The script on disk holds the instructions; running them puts named values in R&#x27;s memory</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="480" fill="white"/>
<path d="M20,70 h430 l30,30 v250 h-460 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<text x="250" y="50" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="bold">day06.R (saved on disk)</text>
<text x="35" y="140" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#203247">initial_mm &lt;- 20</text>
<text x="35" y="190" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#203247">final_mm &lt;- 37</text>
<text x="35" y="240" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#203247">growth_mm &lt;- final_mm - initial_mm</text>
<line x1="500" y1="225" x2="610" y2="225" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="555" y="205" font-family="Arial, sans-serif" font-size="24" fill="#2a7f8f" text-anchor="middle" font-weight="bold">Run</text>
<rect x="620" y="70" width="440" height="280" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="840" y="50" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="bold">R memory (Environment pane)</text>
<text x="660" y="140" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="normal">initial_mm</text>
<text x="1000" y="140" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="end" font-weight="bold">20</text>
<text x="660" y="210" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="normal">final_mm</text>
<text x="1000" y="210" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="end" font-weight="bold">37</text>
<text x="660" y="280" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="normal">growth_mm</text>
<text x="1000" y="280" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="end" font-weight="bold">17</text>
<text x="250" y="420" font-family="Arial, sans-serif" font-size="23" fill="#2a7f8f" text-anchor="middle" font-weight="normal">stays when R restarts</text>
<text x="840" y="420" font-family="Arial, sans-serif" font-size="23" fill="#a8324a" text-anchor="middle" font-weight="normal">gone when R restarts</text>
</svg>
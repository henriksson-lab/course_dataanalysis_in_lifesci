<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A displayed remote session does not synchronise files</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="60" y="75" width="350" height="240" rx="10" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<text x="235" y="130" font-family="Arial, sans-serif" font-size="32" fill="#203247" text-anchor="middle" font-weight="normal">Laptop</text>
<path d="M120,200 v-20 h92.0 l20,20 h118.0 v80 h-230 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="235.0" y="248.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">local files</text>
<rect x="690" y="75" width="350" height="240" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="865" y="130" font-family="Arial, sans-serif" font-size="32" fill="#203247" text-anchor="middle" font-weight="normal">Remote computer</text>
<path d="M750,200 v-20 h92.0 l20,20 h118.0 v80 h-230 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="865.0" y="248.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">remote files</text>
<line x1="440" y1="150" x2="660" y2="150" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="115" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">SSH / desktop</text>
<line x1="440" y1="365" x2="660" y2="365" stroke="#6b4fa0" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="420" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">Explicit file transfer is a separate action.</text>
</svg>
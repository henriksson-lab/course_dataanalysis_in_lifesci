<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>The shell and R interpret different instruction languages</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="60" y="70" width="430" height="300" rx="10" fill="#f8fafc" stroke="#2a7f8f" stroke-width="3"/>
<text x="275" y="125" font-family="Arial, sans-serif" font-size="32" fill="#203247" text-anchor="middle" font-weight="normal">Shell</text>
<text x="275" y="235" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">grep -F treated ...</text>
<rect x="610" y="70" width="430" height="300" rx="10" fill="#f8fafc" stroke="#6b4fa0" stroke-width="3"/>
<text x="825" y="125" font-family="Arial, sans-serif" font-size="32" fill="#203247" text-anchor="middle" font-weight="normal">R Console</text>
<text x="825" y="235" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">mean(c(12, 14, 16))</text>
<text x="550" y="450" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">An interpreter mismatch calls for the right window, not system repair.</text>
</svg>
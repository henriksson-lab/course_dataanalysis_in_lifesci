<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A shell and an R console interpret different languages</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="40" y="100" width="460" height="240" rx="10" fill="#f8fafc" stroke="#2a7f8f" stroke-width="3"/>
<text x="270" y="155" font-family="Arial, sans-serif" font-size="34" fill="#203247" text-anchor="middle" font-weight="bold">Shell</text>
<text x="270" y="245" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">grep -F treated samples.tsv</text>
<rect x="600" y="100" width="460" height="240" rx="10" fill="#f8fafc" stroke="#6b4fa0" stroke-width="3"/>
<text x="830" y="155" font-family="Arial, sans-serif" font-size="34" fill="#203247" text-anchor="middle" font-weight="bold">R console</text>
<text x="830" y="245" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">44.3 - 25.7</text>
<text x="550" y="435" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Choose the interface before typing the instruction.</text>
</svg>
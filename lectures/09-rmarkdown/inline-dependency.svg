<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>CSV input → Imported table → Inline result</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="25.0" y="130" width="240" height="150" rx="10" fill="#eef4f7" stroke="#2a7f8f" stroke-width="3"/>
<text x="145.0" y="175" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="bold">CSV input</text>
<text x="145.0" y="235" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">18 plant rows</text>
<line x1="273.0" y1="205" x2="363.0" y2="205" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="375.0" y="130" width="240" height="150" rx="10" fill="#eef4f7" stroke="#2a7f8f" stroke-width="3"/>
<text x="495.0" y="175" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="bold">Imported table</text>
<text x="495.0" y="235" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">transfer object</text>
<line x1="623.0" y1="205" x2="713.0" y2="205" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="725.0" y="130" width="240" height="150" rx="10" fill="#eef4f7" stroke="#2a7f8f" stroke-width="3"/>
<text x="845.0" y="175" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="bold">Inline result</text>
<text x="845.0" y="235" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">nrow → 18</text>
<text x="550" y="395" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">The number in the prose comes from this saved input.</text>
</svg>
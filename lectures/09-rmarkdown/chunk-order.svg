<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Report chunks execute in order with explicit dependencies</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="260" y="40" width="580" height="95" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="550.0" y="96.5" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="middle" font-weight="normal">1. load packages + import data</text>
<rect x="260" y="190" width="580" height="95" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="550.0" y="246.5" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="middle" font-weight="normal">2. calculate growth</text>
<rect x="260" y="340" width="580" height="95" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="550.0" y="396.5" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="middle" font-weight="normal">3. plot and interpret</text>
<line x1="550" y1="140" x2="550" y2="180" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="550" y1="290" x2="550" y2="330" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
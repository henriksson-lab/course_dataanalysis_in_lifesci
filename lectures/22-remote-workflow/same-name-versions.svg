<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Two files can share a filename while containing different versions</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M100,110 h190 l30,30 v150 h-220 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="290" y1="110" x2="290" y2="140" stroke="#3b5bab" stroke-width="3"/>
<line x1="290" y1="140" x2="320" y2="140" stroke="#3b5bab" stroke-width="3"/>
<text x="210.0" y="325" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">receipt.txt</text>
<path d="M780,110 h190 l30,30 v150 h-220 Z" fill="#f1eaf8" stroke="#3b5bab" stroke-width="3"/>
<line x1="970" y1="110" x2="970" y2="140" stroke="#3b5bab" stroke-width="3"/>
<line x1="970" y1="140" x2="1000" y2="140" stroke="#3b5bab" stroke-width="3"/>
<text x="890.0" y="325" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">receipt.txt</text>
<text x="210" y="190" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">first revision</text>
<text x="890" y="190" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">second revision</text>
<line x1="390" y1="200" x2="690" y2="200" stroke="#a8324a" stroke-width="5" stroke-dasharray="10 8"/>
<text x="550" y="380" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">Equal names do not establish equal contents</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>SSH and remote desktop are two interfaces to a remote environment</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="650" y="120" width="360" height="210" rx="10" fill="#f8fafc" stroke="#6b4fa0" stroke-width="3"/>
<line x1="830" y1="330" x2="830" y2="370" stroke="#6b4fa0" stroke-width="8"/>
<line x1="750" y1="370" x2="910" y2="370" stroke="#6b4fa0" stroke-width="8"/>
<text x="830" y="100" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="bold">Remote environment</text>
<path d="M700,210 v-20 h104.0 l20,20 h136.0 v80 h-260 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="830.0" y="258.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">designated files</text>
<rect x="45" y="70" width="300" height="115" rx="10" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<text x="75" y="115" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="bold">SSH terminal</text>
<text x="75" y="155" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="start" font-weight="normal">$ pwd</text>
<rect x="45" y="295" width="300" height="115" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<path d="M65,345 v-20 h104.0 l20,20 h136.0 v45 h-260 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="195.0" y="375.5" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Remote desktop</text>
<line x1="355" y1="125" x2="625" y2="205" stroke="#3b5bab" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="355" y1="350" x2="625" y2="260" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="455" y="465" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Interfaces are not automatic file transfer</text>
</svg>
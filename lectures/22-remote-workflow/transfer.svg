<rect width="1100" height="500" fill="white"/>
<path d="M90,150 h140 l30,30 v120 h-170 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="230" y1="150" x2="230" y2="180" stroke="#3b5bab" stroke-width="3"/>
<line x1="230" y1="180" x2="260" y2="180" stroke="#3b5bab" stroke-width="3"/>
<text x="175.0" y="335" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">local report.html</text>
<path d="M825,150 h140 l30,30 v120 h-170 Z" fill="#f1eaf8" stroke="#3b5bab" stroke-width="3"/>
<line x1="965" y1="150" x2="965" y2="180" stroke="#3b5bab" stroke-width="3"/>
<line x1="965" y1="180" x2="995" y2="180" stroke="#3b5bab" stroke-width="3"/>
<text x="910.0" y="335" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">remote report.html</text>
<line x1="300" y1="220" x2="785" y2="220" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="175" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">supported upload / download</text>
<text x="185" y="390" font-family="Arial, sans-serif" font-size="26" fill="#2a7f8f" text-anchor="middle" font-weight="normal">name the source</text>
<text x="910" y="390" font-family="Arial, sans-serif" font-size="26" fill="#6b4fa0" text-anchor="middle" font-weight="normal">name the destination</text>
<text x="550" y="465" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Same filename does not mean the same file</text>

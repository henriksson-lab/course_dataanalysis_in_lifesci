project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - overview.qmd
    - intro/*.qmd
    - downloads/index.qmd
    - reference/*.qmd
    - week1/*.qmd
    - week2/*.qmd
    - week3/*.qmd
    - week4/*.qmd
    - week5/*.qmd
  resources:
    - downloads/*.zip
    - data/*
    - report.Rmd

website:

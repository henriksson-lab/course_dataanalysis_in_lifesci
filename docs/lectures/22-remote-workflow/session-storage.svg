<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Closing a session does not remove saved files</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="60" y="80" width="300" height="230" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
<text x="90" y="130" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="start" font-weight="bold">SSH session</text>
<text x="90" y="190" font-family="Arial, sans-serif" font-size="32" fill="#203247" text-anchor="start" font-weight="normal">$ exit</text>
<line x1="90" y1="220" x2="320" y2="280" stroke="#a8324a" stroke-width="8"/>
<line x1="320" y1="220" x2="90" y2="280" stroke="#a8324a" stroke-width="8"/>
<rect x="700" y="70" width="300" height="265" rx="10" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<path d="M740,120 v-20 h88.0 l20,20 h112.0 v80 h-220 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="850.0" y="168.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Saved project</text>
<path d="M810,210 h60 l30,30 v35 h-90 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="870" y1="210" x2="870" y2="240" stroke="#3b5bab" stroke-width="3"/>
<line x1="870" y1="240" x2="900" y2="240" stroke="#3b5bab" stroke-width="3"/>
<text x="855.0" y="310" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report.Rmd</text>
<line x1="380" y1="150" x2="675" y2="150" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="520" y="120" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">save</text>
<line x1="380" y1="300" x2="675" y2="300" stroke="#6b4fa0" stroke-width="4" marker-end="url(#arrow)"/>
<text x="525" y="340" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">reconnect + find</text>
<text x="550" y="440" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">A session and persistent storage have different roles</text>
</svg>
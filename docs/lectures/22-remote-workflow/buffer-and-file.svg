<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>An unsaved edit and the saved file are different states</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="65" y="80" width="390" height="220" rx="10" fill="#f1eaf8" stroke="#6b4fa0" stroke-width="3"/>
<text x="260" y="130" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="bold">Editor buffer</text>
<text x="260" y="195" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="middle" font-weight="normal">second revision</text>
<path d="M785,100 h150 l30,30 v150 h-180 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="935" y1="100" x2="935" y2="130" stroke="#3b5bab" stroke-width="3"/>
<line x1="935" y1="130" x2="965" y2="130" stroke="#3b5bab" stroke-width="3"/>
<text x="875.0" y="315" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">saved receipt.txt</text>
<text x="875" y="180" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">first revision</text>
<line x1="480" y1="185" x2="750" y2="185" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="615" y="145" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="normal">Save?</text>
<text x="550" y="440" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Read the saved file again before claiming what travelled</text>
</svg>
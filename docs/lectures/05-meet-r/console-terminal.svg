<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>The R Console and the terminal read different languages</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="30" y="30" width="500" height="360" rx="10" fill="#f8fafc" stroke="#6b4fa0" stroke-width="3"/>
<text x="280" y="75" font-family="Arial, sans-serif" font-size="27" fill="#6b4fa0" text-anchor="middle" font-weight="bold">R Console (RStudio)</text>
<text x="55" y="150" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">&gt; 44.3 - 25.7</text>
<text x="55" y="188" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#2a7f8f" text-anchor="start" font-weight="normal" xml:space="preserve">[1] 18.6</text>
<text x="55" y="270" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">&gt; pwd</text>
<text x="55" y="308" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#a8324a" text-anchor="start" font-weight="normal" xml:space="preserve">Error: object &#x27;pwd&#x27; not found</text>
<rect x="570" y="30" width="500" height="360" rx="10" fill="#f8fafc" stroke="#2a7f8f" stroke-width="3"/>
<text x="820" y="75" font-family="Arial, sans-serif" font-size="27" fill="#2a7f8f" text-anchor="middle" font-weight="bold">Terminal (shell)</text>
<text x="595" y="150" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">$ pwd</text>
<text x="595" y="188" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#2a7f8f" text-anchor="start" font-weight="normal" xml:space="preserve">/home/you/introcomputing-shell</text>
<text x="595" y="270" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="23" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">$ 44.3 - 25.7</text>
<text x="595" y="308" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#a8324a" text-anchor="start" font-weight="normal" xml:space="preserve">44.3: command not found</text>
<text x="550" y="450" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">Look at the prompt first: &gt; waits for R, $ waits for shell commands.</text>
</svg>
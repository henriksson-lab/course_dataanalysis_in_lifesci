<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Mass ÷ molar mass → Amount ÷ volume → Convert scale</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="25.0" y="130" width="240" height="150" rx="10" fill="#eef4f7" stroke="#2a7f8f" stroke-width="3"/>
<text x="145.0" y="175" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="bold">Mass ÷ molar mass</text>
<text x="145.0" y="235" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">0.2922 / 58.44</text>
<line x1="273.0" y1="205" x2="363.0" y2="205" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="375.0" y="130" width="240" height="150" rx="10" fill="#eef4f7" stroke="#2a7f8f" stroke-width="3"/>
<text x="495.0" y="175" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="bold">Amount ÷ volume</text>
<text x="495.0" y="235" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">0.005 / 0.100</text>
<line x1="623.0" y1="205" x2="713.0" y2="205" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="725.0" y="130" width="240" height="150" rx="10" fill="#eef4f7" stroke="#2a7f8f" stroke-width="3"/>
<text x="845.0" y="175" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="bold">Convert scale</text>
<text x="845.0" y="235" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">0.050 × 1000</text>
<text x="165" y="350" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="normal">mol</text>
<text x="515" y="350" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="normal">mol/L</text>
<text x="865" y="350" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="normal">50 mmol/L</text>
<text x="550" y="450" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">Every factor and conversion is supplied.</text>
</svg>
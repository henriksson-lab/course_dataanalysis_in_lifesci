<text x="350" y="148" font-family="Consolas, Menlo, monospace" font-size="22" fill="#a8324a" text-anchor="start" font-weight="normal" xml:space="preserve">‹ q□ &amp;□ □ [Con</text>
<text x="350" y="186" font-family="Consolas, Menlo, monospace" font-size="22" fill="#a8324a" text-anchor="start" font-weight="normal" xml:space="preserve">tent_Types].xml ìÖæ</text>
<line x1="250" y1="135" x2="315" y2="120" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>

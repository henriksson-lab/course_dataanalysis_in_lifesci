<text x="155.0" y="398.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">seedling-notes</text>
<line x1="285" y1="380" x2="320" y2="380" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="340" y="310" font-family="Consolas, Menlo, monospace" font-size="20" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">word/document.xml</text>
<text x="590" y="310" font-family="Arial, sans-serif" font-size="21" fill="#64748b" text-anchor="start" font-weight="normal">the text</text>
<text x="340" y="348" font-family="Consolas, Menlo, monospace" font-size="20" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">word/styles.xml</text>
<text x="590" y="348" font-family="Arial, sans-serif" font-size="21" fill="#64748b" text-anchor="start" font-weight="normal">fonts, headings</text>
<text x="340" y="386" font-family="Consolas, Menlo, monospace" font-size="20" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">word/theme/...</text>
<text x="590" y="386" font-family="Arial, sans-serif" font-size="21" fill="#64748b" text-anchor="start" font-weight="normal">colours</text>
<text x="340" y="424" font-family="Consolas, Menlo, monospace" font-size="20" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">docProps/core.xml</text>
<text x="590" y="424" font-family="Arial, sans-serif" font-size="21" fill="#64748b" text-anchor="start" font-weight="normal">author, dates</text>
<text x="340" y="462" font-family="Consolas, Menlo, monospace" font-size="20" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">...</text>
<text x="590" y="462" font-family="Arial, sans-serif" font-size="21" fill="#64748b" text-anchor="start" font-weight="normal">16 files in all</text>
<text x="760" y="90" font-family="Arial, sans-serif" font-size="24" fill="#a8324a" text-anchor="start" font-weight="normal">Not readable as text:</text>
<text x="760" y="125" font-family="Arial, sans-serif" font-size="24" fill="#a8324a" text-anchor="start" font-weight="normal">it is a compressed</text>
<text x="760" y="160" font-family="Arial, sans-serif" font-size="24" fill="#a8324a" text-anchor="start" font-weight="normal">ZIP package.</text>
<text x="790" y="360" font-family="Arial, sans-serif" font-size="24" fill="#2a7f8f" text-anchor="start" font-weight="normal">The text is in there,</text>
<text x="790" y="395" font-family="Arial, sans-serif" font-size="24" fill="#2a7f8f" text-anchor="start" font-weight="normal">mixed with formatting</text>
<text x="790" y="430" font-family="Arial, sans-serif" font-size="24" fill="#2a7f8f" text-anchor="start" font-weight="normal">instructions.</text>

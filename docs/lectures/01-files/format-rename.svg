<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Renaming an extension preserves the same text contents</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M120,65 h210 l30,30 v130 h-240 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="330" y1="65" x2="330" y2="95" stroke="#3b5bab" stroke-width="3"/>
<line x1="330" y1="95" x2="360" y2="95" stroke="#3b5bab" stroke-width="3"/>
<text x="240.0" y="260" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">name-test.csv</text>
<path d="M740,65 h210 l30,30 v130 h-240 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="950" y1="65" x2="950" y2="95" stroke="#3b5bab" stroke-width="3"/>
<line x1="950" y1="95" x2="980" y2="95" stroke="#3b5bab" stroke-width="3"/>
<text x="860.0" y="260" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">name-test.txt</text>
<line x1="400" y1="150" x2="690" y2="150" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="545" y="115" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="normal">rename</text>
<rect x="100" y="300" width="280" height="95" rx="10" fill="#f8fafc" stroke="#3b5bab" stroke-width="3"/>
<text x="240" y="340" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">P01,control,</text>
<text x="240" y="378" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">25.7,44.3</text>
<rect x="720" y="300" width="280" height="95" rx="10" fill="#f8fafc" stroke="#3b5bab" stroke-width="3"/>
<text x="860" y="340" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">P01,control,</text>
<text x="860" y="378" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">25.7,44.3</text>
<text x="550" y="465" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">Same bytes and measurements; a different filename.</text>
</svg>
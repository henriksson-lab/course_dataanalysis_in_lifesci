<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A Swedish-language Excel saves CSV with semicolons and decimal commas</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="40" y="40" width="470" height="220" rx="10" fill="#f8fafc" stroke="#3b5bab" stroke-width="3"/>
<rect x="40" y="40" width="470" height="40" rx="10" fill="#dceaf6" stroke="#3b5bab" stroke-width="3"/>
<text x="55" y="68" font-family="Arial, sans-serif" font-size="20" fill="#203247" text-anchor="start" font-weight="bold">seedlings.csv  (course format)</text>
<text x="60" y="115" font-family="Consolas, Menlo, monospace" font-size="19" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">plant_id,treatment,initial_mm,final_mm</text>
<text x="60" y="159" font-family="Consolas, Menlo, monospace" font-size="19" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">P01,control,25.7,44.3</text>
<text x="60" y="203" font-family="Consolas, Menlo, monospace" font-size="19" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">P02,control,24.3,32.3</text>
<rect x="590" y="40" width="470" height="220" rx="10" fill="#f8fafc" stroke="#a8324a" stroke-width="3"/>
<rect x="590" y="40" width="470" height="40" rx="10" fill="#dceaf6" stroke="#a8324a" stroke-width="3"/>
<text x="605" y="68" font-family="Arial, sans-serif" font-size="20" fill="#203247" text-anchor="start" font-weight="bold">seedlings-semicolon.csv</text>
<text x="610" y="115" font-family="Consolas, Menlo, monospace" font-size="19" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">plant_id;treatment;initial_mm;final_mm</text>
<text x="610" y="159" font-family="Consolas, Menlo, monospace" font-size="19" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">P01;control;25,7;44,3</text>
<text x="610" y="203" font-family="Consolas, Menlo, monospace" font-size="19" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">P02;control;24,3;32,3</text>
<text x="550" y="320" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Same numbers. Values are separated by ;  and 25.7 is written 25,7.</text>
<text x="550" y="370" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">A program expecting commas splits the rows in the wrong places.</text>
<text x="550" y="420" font-family="Arial, sans-serif" font-size="24" fill="#2a7f8f" text-anchor="middle" font-weight="normal">Open a CSV in a text editor to see which kind you have.</text>
</svg>
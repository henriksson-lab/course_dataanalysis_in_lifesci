<line x1="655" y1="220" x2="800" y2="220" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="430" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">Instructions are usable when another person can follow them</text>

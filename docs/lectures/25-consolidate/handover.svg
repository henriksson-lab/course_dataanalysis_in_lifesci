<text x="168" y="165" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="bold">Recipient</text>
<circle cx="168" cy="225" r="35" fill="#2a7f8f" stroke="none" stroke-width="3"/>
<path d="M470,110 h120 l30,30 v120 h-150 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>

<line x1="845" y1="175" x2="885" y2="175" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="985" cy="175" r="67" fill="#2a7f8f" stroke="none" stroke-width="3"/>

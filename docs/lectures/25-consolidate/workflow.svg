<text x="985" y="290" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="bold">Reproduce</text>
<path d="M980,345 V415 H125 V345" fill="none" stroke="#64748b" stroke-width="4"/>
<text x="550" y="460" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">Save the source, inputs, output, and a supported backup</text>

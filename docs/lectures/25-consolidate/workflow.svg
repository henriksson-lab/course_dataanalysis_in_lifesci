<text x="340" y="290" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="bold">Check</text>
<line x1="415" y1="175" x2="455" y2="175" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="555" cy="175" r="67" fill="#3b5bab" stroke="none" stroke-width="3"/>
<text x="555" y="185" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="normal">3</text>
<text x="555" y="290" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="bold">Analyse</text>
<line x1="630" y1="175" x2="670" y2="175" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="770" cy="175" r="67" fill="#a8324a" stroke="none" stroke-width="3"/>
<text x="770" y="185" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="normal">4</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A fixed before-after order cannot separate light from elapsed time</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="100" y="180" width="240" height="110" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="220" y="245" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">before reading</text>
<rect x="770" y="180" width="240" height="110" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="890" y="245" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">after reading</text>
<line x1="370" y1="205" x2="735" y2="205" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="150" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="middle" font-weight="normal">illumination changed</text>
<line x1="370" y1="285" x2="735" y2="285" stroke="#6b4fa0" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="350" font-family="Arial, sans-serif" font-size="29" fill="#6b4fa0" text-anchor="middle" font-weight="normal">time passed too</text>
<text x="550" y="440" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">A paired analysis preserves identity; it does not remove order effects.</text>
</svg>
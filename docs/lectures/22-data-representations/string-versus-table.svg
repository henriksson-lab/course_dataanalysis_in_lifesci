<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>One text string and a four-row CSV organise the same four labels differently</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M90,95 h220 l30,30 v180 h-250 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="310" y1="95" x2="310" y2="125" stroke="#3b5bab" stroke-width="3"/>
<line x1="310" y1="125" x2="340" y2="125" stroke="#3b5bab" stroke-width="3"/>
<text x="215.0" y="340" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">bases.txt</text>
<text x="215" y="205" font-family="Arial, sans-serif" font-size="36" fill="#203247" text-anchor="middle" font-weight="normal">ACGT</text>
<path d="M735,95 h220 l30,30 v180 h-250 Z" fill="#f1eaf8" stroke="#3b5bab" stroke-width="3"/>
<line x1="955" y1="95" x2="955" y2="125" stroke="#3b5bab" stroke-width="3"/>
<line x1="955" y1="125" x2="985" y2="125" stroke="#3b5bab" stroke-width="3"/>
<text x="860.0" y="340" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">bases.csv</text>
<text x="785" y="145" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="start" font-weight="normal">position,base</text>
<text x="785" y="177" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="start" font-weight="normal">1,A</text>
<text x="785" y="209" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="start" font-weight="normal">2,C</text>
<text x="785" y="241" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="start" font-weight="normal">3,G</text>
<text x="785" y="273" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="start" font-weight="normal">4,T</text>
<text x="215" y="400" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">one stored string</text>
<text x="860" y="400" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">four table observations</text>
<line x1="390" y1="210" x2="685" y2="210" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="550" y="170" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">reorganise, not rename</text>
</svg>
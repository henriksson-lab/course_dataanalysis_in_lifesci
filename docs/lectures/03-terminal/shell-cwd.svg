<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Each terminal session has its own current working directory</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="50" y="75" width="440" height="300" rx="10" fill="#eef2f6" stroke="#3b5bab" stroke-width="3"/>
<text x="270" y="125" font-family="Arial, sans-serif" font-size="31" fill="#203247" text-anchor="middle" font-weight="normal">Shell A</text>
<text x="75" y="205" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="start" font-weight="normal">$ pwd</text>
<text x="75" y="270" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="start" font-weight="normal">.../day03/readings</text>
<rect x="610" y="75" width="440" height="300" rx="10" fill="#eef2f6" stroke="#3b5bab" stroke-width="3"/>
<text x="830" y="125" font-family="Arial, sans-serif" font-size="31" fill="#203247" text-anchor="middle" font-weight="normal">Shell B</text>
<text x="635" y="205" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="start" font-weight="normal">$ pwd</text>
<text x="635" y="270" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="start" font-weight="normal">.../introcomputing-shell</text>
<text x="550" y="455" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="middle" font-weight="normal">Navigating A does not automatically navigate B.</text>
</svg>
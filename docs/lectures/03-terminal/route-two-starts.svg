<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Two starting locations need different relative paths</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M425,45 v-20 h100.0 l20,20 h130.0 v80 h-250 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="550.0" y="93.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">workspace</text>
<path d="M60,250 v-20 h88.0 l20,20 h112.0 v80 h-220 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="170.0" y="298.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">inputs</text>
<path d="M770,250 v-20 h88.0 l20,20 h112.0 v80 h-220 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="880.0" y="298.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">results</text>
<path d="M770,385 v-20 h88.0 l20,20 h112.0 v70 h-220 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="880.0" y="428.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">notes</text>
<line x1="550" y1="128" x2="170" y2="220" stroke="#64748b" stroke-width="3"/>
<line x1="550" y1="128" x2="880" y2="220" stroke="#64748b" stroke-width="3"/>
<line x1="880" y1="332" x2="880" y2="355" stroke="#64748b" stroke-width="3"/>
<line x1="790" y1="390" x2="570" y2="160" stroke="#6b4fa0" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="520" y1="155" x2="220" y2="240" stroke="#6b4fa0" stroke-width="4" marker-end="url(#arrow)"/>
<text x="370" y="340" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="start" font-weight="normal">From notes: up twice,</text>
<text x="370" y="380" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="start" font-weight="normal">then enter inputs.</text>
</svg>
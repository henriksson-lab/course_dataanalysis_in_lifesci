<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img">
<title>An old .xls sheet holds at most 65,536 rows; rows beyond the limit are not saved</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="520" fill="white"/>
<text x="500" y="45" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="bold">Rows beyond the limit vanish</text>
<text x="140" y="110" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">rows in the</text>
<text x="140" y="140" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">results file</text>
<rect x="240" y="70" width="170" height="300" rx="0" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="325" y="210" font-family="Arial, sans-serif" font-size="22" fill="#203247" text-anchor="middle" font-weight="normal">rows 1 to</text>
<text x="325" y="242" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="bold">65,536</text>
<rect x="240" y="370" width="170" height="120" rx="0" fill="#f9e3e8" stroke="#a8324a" stroke-width="3"/>
<line x1="225" y1="370" x2="425" y2="370" stroke="#a8324a" stroke-width="4" stroke-dasharray="10 8"/>
<text x="325" y="425" font-family="Arial, sans-serif" font-size="22" fill="#a8324a" text-anchor="middle" font-weight="normal">more rows</text>
<text x="325" y="455" font-family="Arial, sans-serif" font-size="22" fill="#a8324a" text-anchor="middle" font-weight="normal">not saved</text>
<text x="450" y="110" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="start" font-weight="normal">Old .xls sheet: 65,536 rows at most.</text>
<text x="450" y="145" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="start" font-weight="normal">No error message, no warning.</text>
<text x="450" y="400" font-family="Arial, sans-serif" font-size="24" fill="#a8324a" text-anchor="start" font-weight="normal">UK, October 2020: about 16,000</text>
<text x="450" y="435" font-family="Arial, sans-serif" font-size="24" fill="#a8324a" text-anchor="start" font-weight="normal">positive COVID-19 tests were</text>
<text x="450" y="470" font-family="Arial, sans-serif" font-size="24" fill="#a8324a" text-anchor="start" font-weight="normal">missed from the daily counts.</text>
</svg>
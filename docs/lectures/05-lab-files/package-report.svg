<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A report folder is packaged into a separate archive</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M70,85 v-20 h104.0 l20,20 h136.0 v80 h-260 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="200.0" y="133.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">report</text>
<path d="M80,230 h140 l30,30 v80 h-170 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="220" y1="230" x2="220" y2="260" stroke="#3b5bab" stroke-width="3"/>
<line x1="220" y1="260" x2="250" y2="260" stroke="#3b5bab" stroke-width="3"/>
<text x="165.0" y="375" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">findings.txt</text>
<path d="M320,230 h140 l30,30 v80 h-170 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="460" y1="230" x2="460" y2="260" stroke="#3b5bab" stroke-width="3"/>
<line x1="460" y1="260" x2="490" y2="260" stroke="#3b5bab" stroke-width="3"/>
<text x="405.0" y="375" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">selected.txt</text>
<line x1="540" y1="230" x2="760" y2="230" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="650" y="175" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">zip -r</text>
<path d="M820,140 h160 l30,30 v140 h-190 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="980" y1="140" x2="980" y2="170" stroke="#3b5bab" stroke-width="3"/>
<line x1="980" y1="170" x2="1010" y2="170" stroke="#3b5bab" stroke-width="3"/>
<text x="915.0" y="345" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report-bundle.zip</text>
<text x="550" y="445" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Keep the ordinary folder; inspect and test the ZIP.</text>
</svg>
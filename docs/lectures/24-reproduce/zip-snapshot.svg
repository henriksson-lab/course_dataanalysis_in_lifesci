<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A ZIP is a snapshot: an older archive keeps the older text</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M40,70 v-20 h100.0 l20,20 h130.0 v75 h-250 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="165.0" y="115.5" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">report-share/</text>
<text x="165" y="205" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">README edited</text>
<text x="165" y="240" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">after v1 was made</text>
<path d="M440,60 h190 l30,30 v100 h-220 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="630" y1="60" x2="630" y2="90" stroke="#3b5bab" stroke-width="3"/>
<line x1="630" y1="90" x2="660" y2="90" stroke="#3b5bab" stroke-width="3"/>
<text x="550.0" y="225" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report-share-v1.zip</text>
<text x="550" y="270" font-family="Arial, sans-serif" font-size="23" fill="#a8324a" text-anchor="middle" font-weight="normal">still the old README</text>
<path d="M830,60 h190 l30,30 v100 h-220 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="1020" y1="60" x2="1020" y2="90" stroke="#3b5bab" stroke-width="3"/>
<line x1="1020" y1="90" x2="1050" y2="90" stroke="#3b5bab" stroke-width="3"/>
<text x="940.0" y="225" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report-share-v2.zip</text>
<text x="940" y="270" font-family="Arial, sans-serif" font-size="23" fill="#2a7f8f" text-anchor="middle" font-weight="normal">contains the edit</text>
<line x1="300" y1="100" x2="420" y2="100" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="360" y="80" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#64748b" text-anchor="middle" font-weight="normal" xml:space="preserve">zip -r</text>
<path d="M 165,265 Q 165,360 600,360 Q 940,360 940,300" fill="none" stroke="#6b4fa0" stroke-width="4"/>
<line x1="940" y1="310" x2="940" y2="300" stroke="#6b4fa0" stroke-width="4" marker-end="url(#arrow)"/>
<text x="560" y="345" font-family="Arial, sans-serif" font-size="22" fill="#6b4fa0" text-anchor="middle" font-weight="normal">zip again, new name</text>
<text x="550" y="455" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Editing the folder never changes an existing ZIP. Make a new one and test it.</text>
</svg>
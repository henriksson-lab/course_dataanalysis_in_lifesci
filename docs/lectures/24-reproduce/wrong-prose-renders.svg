<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A report can render a false prose claim successfully</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M60,100 h180 l30,30 v160 h-210 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="240" y1="100" x2="240" y2="130" stroke="#3b5bab" stroke-width="3"/>
<line x1="240" y1="130" x2="270" y2="130" stroke="#3b5bab" stroke-width="3"/>
<text x="165.0" y="325" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report.Rmd</text>
<text x="165" y="180" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">wrong sentence</text>
<line x1="320" y1="200" x2="740" y2="200" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="530" y="150" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">render succeeds</text>
<path d="M800,100 h180 l30,30 v160 h-210 Z" fill="#f1eaf8" stroke="#3b5bab" stroke-width="3"/>
<line x1="980" y1="100" x2="980" y2="130" stroke="#3b5bab" stroke-width="3"/>
<line x1="980" y1="130" x2="1010" y2="130" stroke="#3b5bab" stroke-width="3"/>
<text x="905.0" y="325" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report.html</text>
<text x="905" y="180" font-family="Arial, sans-serif" font-size="23" fill="#a8324a" text-anchor="middle" font-weight="normal">wrong sentence</text>
<text x="550" y="430" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Software execution is not a check of the biological claim</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Source and data produce a readable report</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M60,100 h140 l30,30 v120 h-170 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="200" y1="100" x2="200" y2="130" stroke="#3b5bab" stroke-width="3"/>
<line x1="200" y1="130" x2="230" y2="130" stroke="#3b5bab" stroke-width="3"/>
<text x="145.0" y="285" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">data.csv</text>
<path d="M330,100 h140 l30,30 v120 h-170 Z" fill="#f1eaf8" stroke="#3b5bab" stroke-width="3"/>
<line x1="470" y1="100" x2="470" y2="130" stroke="#3b5bab" stroke-width="3"/>
<line x1="470" y1="130" x2="500" y2="130" stroke="#3b5bab" stroke-width="3"/>
<text x="415.0" y="285" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report.Rmd</text>
<line x1="555" y1="180" x2="780" y2="180" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="665" y="140" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">render</text>
<path d="M835,100 h140 l30,30 v120 h-170 Z" fill="#e6f3f5" stroke="#3b5bab" stroke-width="3"/>
<line x1="975" y1="100" x2="975" y2="130" stroke="#3b5bab" stroke-width="3"/>
<line x1="975" y1="130" x2="1005" y2="130" stroke="#3b5bab" stroke-width="3"/>
<text x="920.0" y="285" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">report.html</text>
<text x="290" y="400" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="bold">Keep inputs + instructions</text>
<text x="910" y="400" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="bold">Read the result</text>

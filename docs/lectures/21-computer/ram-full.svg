<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>When RAM runs out, the computer swaps to disk or R stops</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="60" y="90" width="330" height="250" rx="10" fill="#f8fafc" stroke="#2a7f8f" stroke-width="3"/>
<text x="225" y="75" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="bold">RAM: 16 GB</text>
<rect x="75" y="105" width="300" height="220" rx="4" fill="#fbe9ed" stroke="#a8324a" stroke-width="3"/>
<text x="225" y="200" font-family="Arial, sans-serif" font-size="28" fill="#a8324a" text-anchor="middle" font-weight="bold">24 GB object</text>
<text x="225" y="240" font-family="Arial, sans-serif" font-size="24" fill="#a8324a" text-anchor="middle" font-weight="normal">does not fit</text>
<line x1="400" y1="160" x2="640" y2="120" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="660" y="60" width="400" height="120" rx="10" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<text x="860" y="105" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="bold">Swapping to disk</text>
<text x="860" y="150" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">everything crawls</text>
<line x1="400" y1="280" x2="640" y2="300" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="660" y="240" width="400" height="120" rx="10" fill="#fbe9ed" stroke="#a8324a" stroke-width="3"/>
<text x="860" y="285" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="bold">R stops</text>
<text x="860" y="330" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">&quot;cannot allocate vector&quot;</text>
<text x="550" y="430" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">Options: fewer rows or columns · a bigger computer (Day 22)</text>
</svg>
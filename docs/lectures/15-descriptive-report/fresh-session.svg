<text x="150.0" y="310" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">saved data</text>
<path d="M455,145 h140 l30,30 v100 h-170 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>

<line x1="645" y1="205" x2="810" y2="205" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="545" cy="365" r="48" fill="white" stroke="#a8324a" stroke-width="3"/>
<text x="545" y="379" font-family="Arial, sans-serif" font-size="42" fill="#a8324a" text-anchor="middle" font-weight="normal">0</text>
<text x="550" y="455" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">Old console objects are not an input to the report.</text>

<line x1="595" y1="175" x2="625" y2="175" stroke="#3b5bab" stroke-width="3"/>
<text x="540.0" y="310" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">saved .Rmd</text>
<path d="M845,145 h140 l30,30 v100 h-170 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="985" y1="145" x2="985" y2="175" stroke="#3b5bab" stroke-width="3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Each part of a path names one folder on the route</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<text x="550" y="80" font-family="Consolas, Menlo, monospace" font-size="30" fill="#203247" text-anchor="middle" font-weight="bold" xml:space="preserve">/home/anna/introcomputing-course/data/seedlings.csv</text>
<path d="M30,190 v-20 h32.0 l20,20 h28.0 v70 h-80 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="70.0" y="233.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">/</text>
<line x1="113" y1="215" x2="137" y2="215" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M140,190 v-20 h48.0 l20,20 h52.0 v70 h-120 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="200.0" y="233.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">home</text>
<line x1="263" y1="215" x2="287" y2="215" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M290,190 v-20 h48.0 l20,20 h52.0 v70 h-120 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="350.0" y="233.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">anna</text>
<line x1="413" y1="215" x2="437" y2="215" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M440,190 v-20 h116.0 l20,20 h154.0 v70 h-290 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="585.0" y="233.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">introcomputing-course</text>
<line x1="733" y1="215" x2="757" y2="215" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M760,190 v-20 h44.0 l20,20 h46.0 v70 h-110 Z" fill="#fff2cc" stroke="#9a7820" stroke-width="3"/>
<text x="815.0" y="233.0" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">data</text>
<line x1="873" y1="215" x2="897" y2="215" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M905,160 h80 l30,30 v80 h-110 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="985" y1="160" x2="985" y2="190" stroke="#3b5bab" stroke-width="3"/>
<line x1="985" y1="190" x2="1015" y2="190" stroke="#3b5bab" stroke-width="3"/>
<text x="960.0" y="305" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">seedlings.csv</text>
<text x="550" y="390" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Read from left to right: start at the top of the disk, open each folder.</text>
<text x="550" y="430" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">On Windows the start is a drive, C:\, and the separator is \ .</text>
</svg>
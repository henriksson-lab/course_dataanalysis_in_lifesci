<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Moving a folder changes the path, not the file</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<text x="270" y="60" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="bold">Before the move</text>
<rect x="40" y="80" width="460" height="210" rx="10" fill="#f8fafc" stroke="#3b5bab" stroke-width="3"/>
<text x="70" y="125" font-family="Consolas, Menlo, monospace" font-size="24" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">practice/</text>
<text x="70" y="167" font-family="Consolas, Menlo, monospace" font-size="24" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">  map-a/</text>
<text x="70" y="209" font-family="Consolas, Menlo, monospace" font-size="24" fill="#a8324a" text-anchor="start" font-weight="normal" xml:space="preserve">    note.txt</text>
<text x="70" y="251" font-family="Consolas, Menlo, monospace" font-size="24" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">  map-b/</text>
<text x="830" y="60" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="bold">After moving map-a into map-b</text>
<rect x="600" y="80" width="460" height="210" rx="10" fill="#f8fafc" stroke="#3b5bab" stroke-width="3"/>
<text x="630" y="125" font-family="Consolas, Menlo, monospace" font-size="24" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">practice/</text>
<text x="630" y="167" font-family="Consolas, Menlo, monospace" font-size="24" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">  map-b/</text>
<text x="630" y="209" font-family="Consolas, Menlo, monospace" font-size="24" fill="#203247" text-anchor="start" font-weight="normal" xml:space="preserve">    map-a/</text>
<text x="630" y="251" font-family="Consolas, Menlo, monospace" font-size="24" fill="#a8324a" text-anchor="start" font-weight="normal" xml:space="preserve">      note.txt</text>
<line x1="510" y1="185" x2="590" y2="185" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="270" y="350" font-family="Consolas, Menlo, monospace" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal" xml:space="preserve">practice/map-a/note.txt</text>
<text x="830" y="350" font-family="Consolas, Menlo, monospace" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal" xml:space="preserve">practice/map-b/map-a/note.txt</text>
<text x="550" y="420" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">The note&#x27;s contents are unchanged. Every written route to it must change.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Closing a process can clear working memory while the saved file remains</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="80" y="65" width="370" height="190" rx="10" fill="#f4eefb" stroke="#6b4fa0" stroke-width="3"/>
<text x="265" y="110" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">Before closing</text>
<text x="265" y="165" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">working memory</text>
<rect x="650" y="65" width="370" height="190" rx="10" fill="#f4eefb" stroke="#6b4fa0" stroke-width="3"/>
<text x="835" y="110" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">After closing</text>
<text x="835" y="165" font-family="Arial, sans-serif" font-size="25" fill="#203247" text-anchor="middle" font-weight="normal">working memory</text>
<text x="265" y="220" font-family="Arial, sans-serif" font-size="31" fill="#203247" text-anchor="middle" font-weight="normal">edited note</text>
<text x="835" y="220" font-family="Arial, sans-serif" font-size="31" fill="#64748b" text-anchor="middle" font-weight="normal">session ended</text>
<line x1="470" y1="160" x2="620" y2="160" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M465,325 h150 l30,30 v60 h-180 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="615" y1="325" x2="615" y2="355" stroke="#3b5bab" stroke-width="3"/>
<line x1="615" y1="355" x2="645" y2="355" stroke="#3b5bab" stroke-width="3"/>
<text x="555.0" y="450" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">saved note on disk</text>
<text x="550" y="480" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Check the ordinary saved file, not only an editor window.</text>
</svg>
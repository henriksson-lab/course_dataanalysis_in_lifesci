<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A measured dilution has a stated final volume, not an added solvent volume</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="125" y="150" width="130" height="200" rx="18" fill="#b8dfe6" stroke="#2a7f8f" stroke-width="3"/>
<text x="190" y="110" font-family="Arial, sans-serif" font-size="30" fill="#203247" text-anchor="middle" font-weight="normal">original</text>
<text x="190" y="405" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">take 1.00 mL</text>
<line x1="300" y1="240" x2="630" y2="240" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="470" y="180" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">add solvent to</text>
<rect x="730" y="65" width="170" height="330" rx="22" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="815" y="440" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="middle" font-weight="normal">10.00 mL total</text>
<text x="815" y="250" font-family="Arial, sans-serif" font-size="28" fill="#203247" text-anchor="middle" font-weight="normal">diluted</text>
</svg>
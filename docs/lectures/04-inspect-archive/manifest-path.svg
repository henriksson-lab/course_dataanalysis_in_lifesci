<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A manifest path and a renamed file can disagree</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<path d="M60,100 h170 l30,30 v125 h-200 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="230" y1="100" x2="230" y2="130" stroke="#3b5bab" stroke-width="3"/>
<line x1="230" y1="130" x2="260" y2="130" stroke="#3b5bab" stroke-width="3"/>
<text x="160.0" y="290" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">manifest</text>
<text x="40" y="380" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="start" font-weight="normal">measurements/S04.csv</text>
<line x1="310" y1="175" x2="570" y2="175" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="430" y="135" font-family="Arial, sans-serif" font-size="25" fill="#a8324a" text-anchor="middle" font-weight="normal">path not found</text>
<path d="M660,100 h200 l30,30 v125 h-230 Z" fill="#eef2ff" stroke="#3b5bab" stroke-width="3"/>
<line x1="860" y1="100" x2="860" y2="130" stroke="#3b5bab" stroke-width="3"/>
<line x1="860" y1="130" x2="890" y2="130" stroke="#3b5bab" stroke-width="3"/>
<text x="775.0" y="290" font-family="Arial, sans-serif" font-size="23" fill="#203247" text-anchor="middle" font-weight="normal">S04-renamed.csv</text>
<text x="780" y="380" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="middle" font-weight="normal">contents: S04,39.8</text>
<text x="550" y="465" font-family="Arial, sans-serif" font-size="24" fill="#203247" text-anchor="middle" font-weight="normal">Inspect identity before restoring a name; do not delete the record.</text>
</svg>
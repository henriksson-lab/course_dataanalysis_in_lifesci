<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Five text lines contain one header and four sample records</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="100" y="50" width="450" height="52" rx="10" fill="#dceaf6" stroke="#3b5bab" stroke-width="3"/>
<text x="130" y="85" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="start" font-weight="normal">header</text>
<rect x="100" y="120" width="450" height="52" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="130" y="155" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="start" font-weight="normal">sample record 1</text>
<rect x="100" y="190" width="450" height="52" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="130" y="225" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="start" font-weight="normal">sample record 2</text>
<rect x="100" y="260" width="450" height="52" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="130" y="295" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="start" font-weight="normal">sample record 3</text>
<rect x="100" y="330" width="450" height="52" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="130" y="365" font-family="Arial, sans-serif" font-size="27" fill="#203247" text-anchor="start" font-weight="normal">sample record 4</text>
<path d="M590,50 h30 v332 h-30" fill="none" stroke="#3b5bab" stroke-width="4"/>
<text x="680" y="145" font-family="Arial, sans-serif" font-size="33" fill="#3b5bab" text-anchor="start" font-weight="normal">wc: 5 lines</text>
<path d="M590,120 h30 v262 h-30" fill="none" stroke="#2a7f8f" stroke-width="4"/>
<text x="680" y="280" font-family="Arial, sans-serif" font-size="33" fill="#2a7f8f" text-anchor="start" font-weight="normal">4 plants</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>A pipe sends selected lines to the next program</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<line x1="60" y1="120" x2="250" y2="120" stroke="#64748b" stroke-width="9"/>
<line x1="60" y1="178" x2="250" y2="178" stroke="#64748b" stroke-width="9"/>
<line x1="60" y1="236" x2="250" y2="236" stroke="#2a7f8f" stroke-width="9"/>
<line x1="60" y1="294" x2="250" y2="294" stroke="#2a7f8f" stroke-width="9"/>
<line x1="290" y1="220" x2="390" y2="220" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="410" y="145" width="220" height="150" rx="10" fill="#e6f3f5" stroke="#2a7f8f" stroke-width="3"/>
<text x="520.0" y="229.0" font-family="Arial, sans-serif" font-size="35" fill="#203247" text-anchor="middle" font-weight="normal">grep</text>
<line x1="650" y1="220" x2="745" y2="220" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="775" y1="185" x2="910" y2="185" stroke="#2a7f8f" stroke-width="9"/>
<line x1="775" y1="250" x2="910" y2="250" stroke="#2a7f8f" stroke-width="9"/>
<line x1="930" y1="220" x2="1000" y2="220" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1040" y="240" font-family="Arial, sans-serif" font-size="62" fill="#3b5bab" text-anchor="middle" font-weight="normal">2</text>
<text x="550" y="420" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Four records → matching lines → wc -l → count</text>
</svg>
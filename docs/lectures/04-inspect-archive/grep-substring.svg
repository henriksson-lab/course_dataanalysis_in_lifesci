<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img">
<title>Literal treated search also matches untreated</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<rect x="75" y="60" width="450" height="65" rx="10" fill="#f8fafc" stroke="#a8324a" stroke-width="3"/>
<text x="100" y="103" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="start" font-weight="normal">S01 untreated</text>
<line x1="550" y1="90" x2="800" y2="90" stroke="#a8324a" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="860" cy="90" r="14" fill="#a8324a" stroke="none" stroke-width="3"/>
<rect x="75" y="145" width="450" height="65" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
<text x="100" y="188" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="start" font-weight="normal">S02 control</text>
<rect x="75" y="230" width="450" height="65" rx="10" fill="#f8fafc" stroke="#2a7f8f" stroke-width="3"/>
<text x="100" y="273" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="start" font-weight="normal">S03 treated</text>
<line x1="550" y1="260" x2="800" y2="260" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="860" cy="260" r="14" fill="#2a7f8f" stroke="none" stroke-width="3"/>
<rect x="75" y="315" width="450" height="65" rx="10" fill="#f8fafc" stroke="#2a7f8f" stroke-width="3"/>
<text x="100" y="358" font-family="Arial, sans-serif" font-size="29" fill="#203247" text-anchor="start" font-weight="normal">S04 treated</text>
<line x1="550" y1="345" x2="800" y2="345" stroke="#2a7f8f" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="860" cy="345" r="14" fill="#2a7f8f" stroke="none" stroke-width="3"/>
<text x="550" y="455" font-family="Arial, sans-serif" font-size="26" fill="#203247" text-anchor="middle" font-weight="normal">Three text matches; not evidence for three treated samples.</text>
